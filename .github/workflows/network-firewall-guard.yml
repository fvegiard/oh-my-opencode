name: Network Firewall Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [master, dev]
    paths:
      - '.github/workflows/**'

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan workflows for sandbox-blocked patterns
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          # Both PR and push: scan only changed workflow files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -E '^\.github/workflows/.*\.ya?ml$' || true)
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # New branch push — no previous commit; scan all workflow files
              FILES=$(find .github/workflows -name "*.yml" -o -name "*.yaml" | sort || true)
            else
              FILES=$(git diff --name-only "$BEFORE..${{ github.sha }}" \
                | grep -E '^\.github/workflows/.*\.ya?ml$' || true)
            fi
          fi

          BLOCK_FINDINGS=""
          INFO_FINDINGS=""

          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            [ -f "$FILE" ] || continue

            # Flag bare 'gh auth status' calls — only || followed by a non-fatal cmd is mitigated
            # 'warn' is not a bash builtin/command — omitted to avoid passing non-fatal checks
            while IFS= read -r line; do
              if echo "$line" | grep -qE "gh auth status"; then
                if echo "$line" | grep -qE "^\s*#|grep[[:space:]].*gh auth status|\|\|[[:space:]]*(echo|printf|true|:)|^\s*(if|while|until)[[:space:]]"; then
                  : # comment, scanner's grep, non-fatal fallback, or conditional eval (if/while/until)
                else
                  LINENUM=$(grep -nF "$line" "$FILE" | head -1 | cut -d: -f1)
                  BLOCK_FINDINGS="${BLOCK_FINDINGS}BLOCK ${FILE}:${LINENUM}: gh auth status without || mitigation\n  Fix: append || echo ::warning::blocked\n"
                fi
              fi
            done < <(grep -E "gh auth status" "$FILE" || true)

            # PostHog telemetry - anchored variable name (no NOT_OMO_ prefix), anchored value,
            # accepts single/double/no quotes; all runtime-truthy/falsy forms from the PostHog SDK
            if grep -vE "^\s*#" "$FILE" | grep -qE "us\.i\.posthog\.com|posthog"; then
              if grep -vE "^\s*#" "$FILE" | grep -qE "(^|[^a-zA-Z_])OMO_DISABLE_POSTHOG[[:space:]]*:[[:space:]]*[\"']?(1|true|yes)[\"']?([[:space:]]|\$)|(^|[^a-zA-Z_])OMO_DISABLE_POSTHOG=[\"']?(1|true|yes)[\"']?([[:space:]]|\$)" || \
                 grep -vE "^\s*#" "$FILE" | grep -qE "(^|[^a-zA-Z_])OMO_SEND_ANONYMOUS_TELEMETRY[[:space:]]*:[[:space:]]*[\"']?(0|false|no)[\"']?([[:space:]]|\$)|(^|[^a-zA-Z_])OMO_SEND_ANONYMOUS_TELEMETRY=[\"']?(0|false|no)[\"']?([[:space:]]|\$)"; then
                : # properly mitigated (runtime disables on either flag)
              else
                LINENUM=$(grep -nE "posthog" "$FILE" | head -1 | cut -d: -f1)
                BLOCK_FINDINGS="${BLOCK_FINDINGS}BLOCK ${FILE}:${LINENUM}: PostHog without valid opt-out value\n  Fix: OMO_DISABLE_POSTHOG: 1 and OMO_SEND_ANONYMOUS_TELEMETRY: 0\n"
              fi
            fi

            # lazycodex installer (via npx) - skip commented invocations (# npx lazycodex).
            # Accepts: OMO_CODEX_DISABLE_POSTHOG, OMO_DISABLE_POSTHOG (truthy), or
            # OMO_CODEX_SEND_ANONYMOUS_TELEMETRY / OMO_SEND_ANONYMOUS_TELEMETRY (falsy incl. yes).
            # Opt-out check also skips commented lines so # OMO_CODEX_DISABLE_POSTHOG: 1 is not mitigation.
            if grep -vE "^\s*#" "$FILE" | grep -qE "npx.*lazycodex"; then
              if grep -vE "^\s*#" "$FILE" | grep -qE "(^|[^a-zA-Z_])OMO_CODEX_DISABLE_POSTHOG[[:space:]]*:[[:space:]]*[\"']?(1|true|yes)[\"']?([[:space:]]|\$)|(^|[^a-zA-Z_])OMO_CODEX_DISABLE_POSTHOG=[\"']?(1|true|yes)[\"']?([[:space:]]|\$)" || \
                 grep -vE "^\s*#" "$FILE" | grep -qE "(^|[^a-zA-Z_])OMO_DISABLE_POSTHOG[[:space:]]*:[[:space:]]*[\"']?(1|true|yes)[\"']?([[:space:]]|\$)|(^|[^a-zA-Z_])OMO_DISABLE_POSTHOG=[\"']?(1|true|yes)[\"']?([[:space:]]|\$)" || \
                 grep -vE "^\s*#" "$FILE" | grep -qE "(^|[^a-zA-Z_])OMO_CODEX_SEND_ANONYMOUS_TELEMETRY[[:space:]]*:[[:space:]]*[\"']?(0|false|no|yes)[\"']?([[:space:]]|\$)|(^|[^a-zA-Z_])OMO_CODEX_SEND_ANONYMOUS_TELEMETRY=[\"']?(0|false|no|yes)[\"']?([[:space:]]|\$)" || \
                 grep -vE "^\s*#" "$FILE" | grep -qE "(^|[^a-zA-Z_])OMO_SEND_ANONYMOUS_TELEMETRY[[:space:]]*:[[:space:]]*[\"']?(0|false|no|yes)[\"']?([[:space:]]|\$)|(^|[^a-zA-Z_])OMO_SEND_ANONYMOUS_TELEMETRY=[\"']?(0|false|no|yes)[\"']?([[:space:]]|\$)"; then
                : # properly mitigated
              else
                LINENUM=$(awk '!/^[[:space:]]*#/ && /npx.*lazycodex/ {print NR; exit}' "$FILE")
                BLOCK_FINDINGS="${BLOCK_FINDINGS}BLOCK ${FILE}:${LINENUM}: lazycodex installer without OMO_CODEX_DISABLE_POSTHOG opt-out\n  Fix: OMO_CODEX_DISABLE_POSTHOG: 1 or OMO_DISABLE_POSTHOG: 1\n"
              fi
            fi

            # curl opencode.ai - info only
            if grep -qE "curl.*opencode\.ai" "$FILE"; then
              LINENUM=$(grep -nE "curl.*opencode\.ai" "$FILE" | head -1 | cut -d: -f1)
              INFO_FINDINGS="${INFO_FINDINGS}INFO ${FILE}:${LINENUM}: curl to opencode.ai may be blocked on locked-down runners\n"
            fi
          done <<< "$FILES"

          # Write findings to temp file to avoid shell injection and YAML indentation issues
          FINDINGS_FILE=$(mktemp)
          [ -n "$BLOCK_FINDINGS" ] && printf '%b' "$BLOCK_FINDINGS" >> "$FINDINGS_FILE"
          [ -n "$INFO_FINDINGS" ] && printf '%b' "$INFO_FINDINGS" >> "$FINDINGS_FILE"

          if [ ! -s "$FINDINGS_FILE" ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "findings_file=" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$BLOCK_FINDINGS" ]; then
              echo "clean=false" >> "$GITHUB_OUTPUT"
            else
              echo "clean=true" >> "$GITHUB_OUTPUT"
            fi
            echo "findings_file=$FINDINGS_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Network Firewall Guard
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            Scans changed workflow files for patterns known to fail in Codex/restricted runners.
            Flags: gh auth (api.github.com), PostHog telemetry, npx lazycodex without opt-out.
            Checks actual opt-out values (not just variable presence).
          JOB_SUMMARY_NEXT: |
            If blocked: append || echo ::warning:: to gh auth status, add OMO_DISABLE_POSTHOG: 1
            and OMO_SEND_ANONYMOUS_TELEMETRY: 0 for PostHog, or OMO_CODEX_DISABLE_POSTHOG: 1 for lazycodex.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

      - name: Comment on PR with findings
        if: github.event_name == 'pull_request' && steps.scan.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          FINDINGS_FILE: ${{ steps.scan.outputs.findings_file }}
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "## Network Firewall Guard - Sandbox-blocking patterns detected"
            echo ""
            echo "The following patterns in changed workflow files are known to fail in Codex / restricted runners:"
            echo ""
            cat "$FINDINGS_FILE"
            echo ""
            echo "### Standard fixes"
            echo "- gh auth status: append || echo ::warning::blocked (non-fatal)"
            echo "- PostHog: add OMO_DISABLE_POSTHOG: 1 and OMO_SEND_ANONYMOUS_TELEMETRY: 0 to job env"
            echo "- npx lazycodex: add OMO_CODEX_DISABLE_POSTHOG: 1 to job env"
            echo ""
            echo "Auto-detected by .github/workflows/network-firewall-guard.yml"
          } > "$BODY_FILE"
          gh pr comment "$PR_URL" --body-file "$BODY_FILE"

      - name: Fail if blocking patterns found
        if: steps.scan.outputs.clean == 'false'
        run: |
          echo "::error::Sandbox-blocking network patterns found in changed workflow files. See summary."
          exit 1
