name: Network Firewall Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [master, dev]
    paths:
      - '.github/workflows/**'

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan workflows for sandbox-blocked patterns
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          THIS_FILE=".github/workflows/network-firewall-guard.yml"

          # On PRs scan only changed workflow files; on push scan all (except self)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep '^\.github/workflows/.*\.yml$' || true)
          else
            FILES=$(find .github/workflows -name "*.yml" | sort)
          fi

          BLOCK_FINDINGS=""
          INFO_FINDINGS=""

          for FILE in $FILES; do
            [ "$FILE" = "$THIS_FILE" ] && continue
            [ -f "$FILE" ] || continue

            # gh auth status - flag only when NOT already made non-fatal (no || after it)
            while IFS= read -r line; do
              if echo "$line" | grep -qE "gh auth status"; then
                if echo "$line" | grep -qE "\|\|"; then
                  : # already mitigated
                else
                  LINENUM=$(grep -nF "$line" "$FILE" | head -1 | cut -d: -f1)
                  BLOCK_FINDINGS="${BLOCK_FINDINGS}BLOCK ${FILE}:${LINENUM}: ${line}\n  Fix: append '|| echo ::warning::blocked' - api.github.com is blocked in Codex sandbox\n"
                fi
              fi
            done < <(grep -E "gh auth status" "$FILE" || true)

            # PostHog / telemetry - flag only when OMO opt-out not present in same file
            if grep -qiE "us\.i\.posthog\.com|posthog" "$FILE"; then
              if grep -qE "OMO_DISABLE_POSTHOG|OMO_SEND_ANONYMOUS_TELEMETRY|DO_NOT_TRACK" "$FILE"; then
                : # already mitigated
              else
                LINENUM=$(grep -niE "posthog" "$FILE" | head -1 | cut -d: -f1)
                BLOCK_FINDINGS="${BLOCK_FINDINGS}BLOCK ${FILE}:${LINENUM}: posthog call detected\n  Fix: add OMO_DISABLE_POSTHOG=1 and OMO_SEND_ANONYMOUS_TELEMETRY=0 to job env:\n"
              fi
            fi

            # npx lazycodex without DO_NOT_TRACK
            if grep -qE "npx.*lazycodex" "$FILE"; then
              if grep -qE "DO_NOT_TRACK|OMO_DISABLE_POSTHOG" "$FILE"; then
                : # already mitigated
              else
                LINENUM=$(grep -nE "npx.*lazycodex" "$FILE" | head -1 | cut -d: -f1)
                BLOCK_FINDINGS="${BLOCK_FINDINGS}BLOCK ${FILE}:${LINENUM}: npx lazycodex without telemetry opt-out\n  Fix: add DO_NOT_TRACK=1 to job env:\n"
              fi
            fi

            # curl to opencode.ai - info only, not a hard block
            if grep -qE "curl.*opencode\.ai" "$FILE"; then
              LINENUM=$(grep -nE "curl.*opencode\.ai" "$FILE" | head -1 | cut -d: -f1)
              INFO_FINDINGS="${INFO_FINDINGS}INFO ${FILE}:${LINENUM}: curl to opencode.ai may be blocked on locked-down runners\n"
            fi
          done

          if [ -z "$BLOCK_FINDINGS" ] && [ -z "$INFO_FINDINGS" ]; then
            echo "findings=" >> "$GITHUB_OUTPUT"
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "findings<<EOF"
              [ -n "$BLOCK_FINDINGS" ] && echo -e "$BLOCK_FINDINGS"
              [ -n "$INFO_FINDINGS" ] && echo -e "$INFO_FINDINGS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            if [ -n "$BLOCK_FINDINGS" ]; then
              echo "clean=false" >> "$GITHUB_OUTPUT"
            else
              echo "clean=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Network Firewall Guard
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            Scans changed workflow files for patterns known to fail in Codex/restricted runners.
            Flags: gh auth status (api.github.com), PostHog telemetry, npx lazycodex without opt-out.
            Skips patterns already mitigated (|| echo, OMO_DISABLE_POSTHOG, DO_NOT_TRACK).
          JOB_SUMMARY_NEXT: |
            If blocked: append '|| echo ::warning::' to gh auth status, add OMO_DISABLE_POSTHOG=1
            and OMO_SEND_ANONYMOUS_TELEMETRY=0 for PostHog, or DO_NOT_TRACK=1 for npx lazycodex.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

      - name: Comment on PR with findings
        if: github.event_name == 'pull_request' && steps.scan.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "$(cat <<'EOF'
          ## Network Firewall Guard - Sandbox-blocking patterns detected

          The following patterns in changed workflow files are known to fail in Codex / restricted runners:

          ${{ steps.scan.outputs.findings }}

          ### Standard fixes
          - gh auth status -> append || echo ::warning::blocked (non-fatal; login via --with-token is sufficient)
          - PostHog telemetry -> add OMO_DISABLE_POSTHOG=1 and OMO_SEND_ANONYMOUS_TELEMETRY=0 to job env:
          - npx lazycodex -> add DO_NOT_TRACK=1 to job env:

          Auto-detected by .github/workflows/network-firewall-guard.yml
          EOF
          )"

      - name: Fail if blocking patterns found
        if: steps.scan.outputs.clean == 'false'
        run: |
          echo "::error::Sandbox-blocking network patterns found in changed workflow files. See summary."
          exit 1
